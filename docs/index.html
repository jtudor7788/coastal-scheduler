<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coastal Cleaning Scheduler</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e7c86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coastal">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --teal:#0e7c86; --teal-d:#0a5d65; --bg:#f3f7f8; --card:#fff; --ink:#17282b; --mute:#66797c; --line:#dbe5e7; --ok:#2e9d5b; --warn:#d9822b; --bad:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--teal); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; }
  header button { margin-left:4px; background:rgba(255,255,255,.18); color:#fff; border:0; padding:6px 12px; border-radius:8px; }
  main { max-width:900px; margin:0 auto; padding:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2 { margin:0 0 10px; font-size:17px; }
  label { display:block; font-size:13px; color:var(--mute); margin:8px 0 3px; }
  input, select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  button { font:inherit; cursor:pointer; }
  .btn { background:var(--teal); color:#fff; border:0; padding:10px 16px; border-radius:8px; font-weight:600; }
  .btn:hover { background:var(--teal-d); }
  .btn.sec { background:#e8f0f1; color:var(--ink); }
  .btn.danger { background:#fbe9e7; color:var(--bad); }
  .btn.sm { padding:5px 10px; font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; } .row > * { flex:1; min-width:120px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { flex:1; padding:10px; border:1px solid var(--line); background:#fff; border-radius:8px; font-weight:600; }
  .tabs button.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 10px; text-align:center; min-width:62px; line-height:1.2; }
  .chip small { display:block; color:var(--mute); font-size:11px; }
  .chip.on { background:var(--teal); border-color:var(--teal); color:#fff; } .chip.on small { color:#d7f0f2; }
  .chip.posted { border-color:var(--ok); } .chip.posted::after { content:'✓'; color:var(--ok); font-size:12px; display:block; }
  .chip.on.posted::after { color:#fff; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .open { background:#fff3e0; color:var(--warn); } .assigned { background:#e3f2fd; color:#1565c0; }
  .confirmed { background:#e6f4ea; color:var(--ok); } .done { background:#eee; color:#666; }
  .day { border-top:1px solid var(--line); padding:12px 0; } .day:first-child { border-top:0; }
  .day h3 { margin:0 0 6px; font-size:15px; }
  .avail { font-size:13px; color:var(--mute); margin-bottom:8px; }
  .avail b { color:var(--ink); font-weight:600; }
  .clean { background:#f8fbfb; border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:8px; padding:10px; margin:8px 0; }
  .clean.assigned, .clean.confirmed { border-left-color:var(--ok); }
  .clean .t { font-weight:600; } .clean .m { color:var(--mute); font-size:13px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .err { color:var(--bad); font-size:14px; min-height:20px; margin-top:6px; }
  .empty { color:var(--mute); font-style:italic; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .modal > div { background:#fff; width:100%; max-width:520px; border-radius:16px 16px 0 0; padding:16px; max-height:85vh; overflow:auto; }
  .cand { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .cand .w { font-size:12px; color:var(--mute); } .cand .flag { color:var(--warn); font-size:12px; }
  .mgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin:10px 0; }
  .mi { position:relative; } .mi img, .mi video { width:100%; height:100px; object-fit:cover; border-radius:8px; background:#e8f0f1; display:block; }
  .mi small { display:block; font-size:11px; color:var(--mute); } .mi .x { position:absolute; top:4px; right:4px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:99px; width:22px; height:22px; line-height:20px; padding:0; }
  .linkbox { background:#f1f7f8; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; word-break:break-all; margin:8px 0; }
  @media (min-width:700px){ .modal { align-items:center; } .modal > div { border-radius:16px; } }
  .chat { max-height:42vh; overflow:auto; background:#f3f7f8; border-radius:10px; padding:8px; margin:8px 0; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:85%; align-self:flex-start; } .msg.me { align-self:flex-end; }
  .msg .b { background:#fff; border:1px solid var(--line); border-radius:12px; padding:7px 10px; white-space:pre-wrap; word-break:break-word; }
  .msg.me .b { background:var(--teal); color:#fff; border-color:var(--teal); }
  .msg small { display:block; color:var(--mute); font-size:11px; margin:2px 4px; } .msg.me small { text-align:right; }
  .feepill { display:inline-block; margin-top:4px; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; background:#fff3e0; color:var(--warn); }
  .feepill.approved { background:#e3f5ea; color:var(--ok); } .feepill.declined { background:#fbe9e7; color:var(--bad); }
  .badge { background:var(--bad); color:#fff; border-radius:10px; padding:0 6px; font-size:12px; margin-left:4px; }
  .access { background:#fff8e1; border:1px solid #f0d58a; border-radius:8px; padding:6px 8px; margin-top:4px; white-space:pre-wrap; font-size:14px; }
  .warnbox { background:#fbe9e7; color:var(--bad); border-radius:8px; padding:6px 8px; margin-top:4px; font-size:14px; font-weight:600; }
  .task { display:flex; gap:10px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); }
  .task input { width:22px; height:22px; flex:none; } .task.done span { color:var(--mute); text-decoration:line-through; }
  .task button { margin-left:auto; background:none; border:0; color:var(--bad); font-size:20px; }
  .hint { color:var(--mute); font-size:13px; }
</style>
</head>
<body>
<header><h1>🌊 Coastal Cleaning Scheduler</h1><span><button id="install" hidden>📲 Install</button> <button id="logout" hidden>Sign out</button></span></header>
<main id="app"></main>

<script src="config.js"></script>
<script>
const API = (window.COASTAL_API_BASE || '').replace(/\/$/, '');
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session = JSON.parse(localStorage.getItem('session') || 'null');

async function api(path, opts = {}) {
  const r = await fetch(API + path, { method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(session ? { Authorization: 'Bearer ' + session.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && session) { logout(); throw new Error('Session expired'); }
  if (!r.ok) { const e = new Error(data.error || 'Request failed'); e.data = data; e.status = r.status; throw e; }
  return data;
}
function logout() { session = null; localStorage.removeItem('session'); render(); }
$('#logout').onclick = logout;

// dates (local, avoids UTC off-by-one)
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dow = d => d.toLocaleDateString(undefined, { weekday: 'short' });
const pretty = s => parse(s).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
const t12 = t => { let [h,m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; };
const mondayOf = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };

function render() {
  $('#logout').hidden = !session;
  if (!session) return loginView();
  session.role === 'admin' ? adminView() : cleanerView();
}

// ---------------- login ----------------
async function loginView() {
  const cleaners = await fetch(API + '/api/cleaners/public').then(r => r.json());
  $('#app').innerHTML = `
    <div class="tabs"><button id="tc" class="on">Cleaner</button><button id="ta">Nicole (Admin)</button></div>
    <div class="card" id="lc">
      <h2>Cleaner sign in</h2>
      <label>Your name</label>
      <select id="cn">${cleaners.length ? cleaners.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('') : '<option value="">No cleaners added yet</option>'}</select>
      <label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
      <div class="err" id="lerr"></div>
      <button class="btn" id="go">Sign in</button>
    </div>
    <div class="card" id="la" hidden>
      <h2>Admin sign in</h2>
      <label>Password</label><input id="pw" type="password" autocomplete="current-password">
      <div class="err" id="aerr"></div>
      <button class="btn" id="goa">Sign in</button>
    </div>`;
  $('#tc').onclick = () => { $('#lc').hidden = false; $('#la').hidden = true; $('#tc').classList.add('on'); $('#ta').classList.remove('on'); };
  $('#ta').onclick = () => { $('#lc').hidden = true; $('#la').hidden = false; $('#ta').classList.add('on'); $('#tc').classList.remove('on'); };
  const done = s => { session = s; localStorage.setItem('session', JSON.stringify(s)); render(); };
  $('#go').onclick = async () => { try { done(await api('/api/login/cleaner', { method:'POST', body:{ cleaner_id: +$('#cn').value, pin: $('#pin').value } })); } catch (e) { $('#lerr').textContent = e.message; } };
  $('#goa').onclick = async () => { try { done(await api('/api/login/admin', { method:'POST', body:{ password: $('#pw').value } })); } catch (e) { $('#aerr').textContent = e.message; } };
  $('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#goa').click(); });
}

// ---------------- cleaner ----------------
async function cleanerView() {
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Array.from({ length: 28 }, (_, i) => addDays(today, i));
  const [avail, cleans] = await Promise.all([api('/api/me/availability'), api('/api/me/cleans?from=' + iso(addDays(today, -7)))]);
  const cmap = Object.fromEntries(cleans.map(c => [c.id, c]));
  const posted = new Map(avail.map(a => [a.date, a]));
  const picked = new Set();

  $('#app').innerHTML = `
    <div class="card"><h2>Hi ${esc(session.name)} 👋</h2>
      <div id="mine"></div></div>
    <div class="card"><h2>Post days you can work</h2>
      <div class="chips" id="chips">${days.map(d => `<button class="chip ${posted.has(iso(d)) ? 'posted' : ''}" data-d="${iso(d)}">${dow(d)}<br><b>${d.getMonth()+1}/${d.getDate()}</b></button>`).join('')}</div>
      <div class="row"><div><label>From</label><input type="time" id="st" value="08:00"></div><div><label>Until</label><input type="time" id="et" value="17:00"></div></div>
      <label>Note (optional)</label><input id="note" placeholder="e.g. need to be done by 3 for pickup">
      <div class="err" id="err"></div>
      <button class="btn" id="save">Post selected days</button>
    </div>
    <div class="card"><h2>Days I've posted</h2><div id="posted"></div></div>`;

  $('#mine').innerHTML = cleans.length ? cleans.map(c => `
    <div class="clean ${c.status}"><div class="t">${pretty(c.date)} · ${t12(c.start_time)} <span class="pill ${c.status}">${c.status}</span></div>
      <div class="m">${esc(c.client)} — ${esc(c.type)} (~${c.duration_hours}h)</div>
      <div class="m">${esc(c.address)}</div>${c.notes ? `<div class="m">📝 ${esc(c.notes)}</div>` : ''}
      ${c.access_info && c.status !== 'done' ? `<div class="access">🔑 ${esc(c.access_info)}</div>` : ''}
      ${c.clock_in ? `<div class="m hint">⏱ Started ${new Date(c.clock_in).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${c.clock_out ? ' · finished ' + new Date(c.clock_out).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) + ' (' + fmtDur(c.clock_in, c.clock_out) + ')' : ''}</div>` : ''}
      <div class="actions">${c.status === 'assigned' ? `<button class="btn sm" data-confirm="${c.id}">Confirm I'll be there</button>` : ''}
        ${['assigned','confirmed'].includes(c.status) && !c.clock_in ? `<button class="btn sm" data-in="${c.id}">▶ Clock in</button>` : ''}
        ${['assigned','confirmed'].includes(c.status) && c.clock_in ? `<button class="btn sm" data-tasks="${c.id}">☑ Checklist${c.tasks_total ? ` (${c.tasks_done}/${c.tasks_total})` : ''} &amp; finish</button>` : ''}
        ${c.status === 'done' ? `<button class="btn sm sec" data-tasks="${c.id}">☑ View checklist</button>` : ''}
        <button class="btn sm sec" data-sup="${c.id}">🧴 Need supplies</button>
        ${['assigned','confirmed'].includes(c.status) && !c.clock_in ? `<button class="btn sm danger" data-cant="${c.id}">Can't make it</button>` : ''}
        <button class="btn sm sec" data-media="${c.id}">📷 Photos &amp; video</button>
        <button class="btn sm sec" data-msg="${c.id}">💬 Messages${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</button></div>
    </div>`).join('') : '<div class="empty">No cleans assigned to you yet.</div>';
  $('#mine').querySelectorAll('[data-media]').forEach(b => b.onclick = () => cleanerMediaModal(cmap[b.dataset.media]));
  $('#mine').querySelectorAll('[data-in]').forEach(b => b.onclick = async () => { try { await api(`/api/me/cleans/${b.dataset.in}/clock-in`, { method:'POST' }); cleanerView(); } catch (e) { alert(e.message); } });
  $('#mine').querySelectorAll('[data-tasks]').forEach(b => b.onclick = () => cleanerTasksModal(cmap[b.dataset.tasks]));
  $('#mine').querySelectorAll('[data-sup]').forEach(b => b.onclick = () => suppliesModal(cmap[b.dataset.sup]));
  $('#mine').querySelectorAll('[data-cant]').forEach(b => b.onclick = async () => {
    const reason = prompt("Can't make this clean? Tell Nicole why (she'll find someone else):"); if (!reason || !reason.trim()) return;
    try { await api(`/api/me/cleans/${b.dataset.cant}/cant-make-it`, { method:'POST', body:{ reason } }); cleanerView(); } catch (e) { alert(e.message); } });
  $('#mine').querySelectorAll('[data-msg]').forEach(b => b.onclick = () => chatModal(cmap[b.dataset.msg], 'cleaner'));
  $('#mine').querySelectorAll('[data-confirm]').forEach(b => b.onclick = async () => { await api(`/api/me/cleans/${b.dataset.confirm}/confirm`, { method:'POST' }); cleanerView(); });

  $('#posted').innerHTML = avail.length ? avail.map(a => `
    <div class="cand"><div><b>${pretty(a.date)}</b><div class="w">${t12(a.start_time)} – ${t12(a.end_time)}${a.note ? ' · ' + esc(a.note) : ''}</div></div>
    <button class="btn sm danger" data-rm="${a.date}">Remove</button></div>`).join('') : '<div class="empty">Nothing posted yet.</div>';
  $('#posted').querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    try { await api('/api/me/availability/' + b.dataset.rm, { method:'DELETE' }); cleanerView(); } catch (e) { alert(e.message); } });

  $('#chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return;
    picked.has(b.dataset.d) ? picked.delete(b.dataset.d) : picked.add(b.dataset.d); b.classList.toggle('on'); };
  $('#save').onclick = async () => {
    try { await api('/api/me/availability', { method:'POST', body:{ dates:[...picked], start_time:$('#st').value, end_time:$('#et').value, note:$('#note').value } }); cleanerView(); }
    catch (e) { $('#err').textContent = e.message; } };
}

// ---------------- admin ----------------
let adminTab = 'board', weekStart = mondayOf(new Date());

function adminView() {
  $('#app').innerHTML = `
    <div class="tabs"><button data-t="board">Schedule</button><button data-t="props">Properties</button><button data-t="supplies" id="suptab">Supplies</button><button data-t="cleaners">Cleaners</button></div>
    <div id="body"></div>`;
  api('/api/admin/supplies').then(l => { const n = l.filter(x => x.status === 'open').length; if (n && $('#suptab')) $('#suptab').innerHTML = `Supplies<span class="badge">${n}</span>`; }).catch(() => {});
  document.querySelectorAll('.tabs button').forEach(b => { b.classList.toggle('on', b.dataset.t === adminTab); b.onclick = () => { adminTab = b.dataset.t; adminView(); }; });
  ({ board: boardView, props: propsView, supplies: suppliesView, cleaners: cleanersView })[adminTab]();
}

let genDone = false;
async function boardView() {
  if (!genDone) { genDone = true; await api('/api/admin/recurring/generate', { method:'POST' }).catch(() => {}); }
  const from = iso(weekStart), to = iso(addDays(weekStart, 6));
  const [{ cleans, availability }, requests] = await Promise.all([api(`/api/admin/board?from=${from}&to=${to}`), api('/api/admin/requests')]);
  const open = cleans.filter(c => c.status === 'open').length;
  let html = `
    <div class="nav"><button class="btn sec sm" id="prev">◀ Prev</button>
      <div style="text-align:center"><b>${parse(from).toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${parse(to).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</b>
      <div class="m" style="color:var(--mute);font-size:13px">${cleans.length} cleans · ${open} need a cleaner</div></div>
      <button class="btn sec sm" id="next">Next ▶</button></div>
    ${requests.length ? `<div class="card" style="border-color:var(--warn)"><h2>📥 Client requests (${requests.length})</h2>
      ${requests.map(r => `<div class="clean">
        <div class="t">${pretty(r.date)} · ${t12(r.start_time)} · ${esc(r.type)}</div>
        <div class="m"><b>${esc(r.contact_name)}</b>${r.contact_phone ? ' · <a href="tel:' + esc(r.contact_phone) + '">' + esc(r.contact_phone) + '</a>' : ''}${r.contact_email ? ' · <a href="mailto:' + esc(r.contact_email) + '">' + esc(r.contact_email) + '</a>' : ''}</div>
        <div class="m">${esc(r.address)}</div>${r.notes ? `<div class="m">📝 ${esc(r.notes)}</div>` : ''}
        <div class="actions"><button class="btn sm" data-ap="${r.id}">Approve → needs cleaner</button><button class="btn sm sec" data-ed="${r.id}">Edit</button><button class="btn sm danger" data-dc="${r.id}">Decline</button></div>
      </div>`).join('')}</div>` : ''}
    <div class="card"><button class="btn" id="addclean">＋ Post a clean</button></div><div class="card">`;
  for (let i = 0; i < 7; i++) {
    const ds = iso(addDays(weekStart, i));
    const av = availability.filter(a => a.date === ds);
    const dc = cleans.filter(c => c.date === ds);
    html += `<div class="day"><h3>${pretty(ds)}</h3>
      <div class="avail">${av.length ? 'Available: ' + av.map(a => `<b>${esc(a.name)}</b> ${t12(a.start_time)}–${t12(a.end_time)}`).join(' · ') : 'No one posted'}</div>
      ${dc.map(c => `<div class="clean ${c.status}">
        <div class="t">${t12(c.start_time)} · ${esc(c.client)} <span class="pill ${c.status}">${c.status}</span>${c.rule_id ? ' 🔁' : ''}</div>
        <div class="m">${esc(c.type)} · ~${c.duration_hours}h${c.address ? ' · ' + esc(c.address) : ''}</div>
        ${c.notes ? `<div class="m">📝 ${esc(c.notes)}</div>` : ''}
        ${c.source === 'client' ? `<div class="m">☎ ${esc(c.contact_phone || c.contact_email || '')}</div>` : ''}
        ${c.cleaner_name ? `<div class="m">👤 <b>${esc(c.cleaner_name)}</b></div>` : ''}
        ${c.release_note && !c.cleaner_id ? `<div class="warnbox">⚠ Can't make it — ${esc(c.release_note)}</div>` : ''}
        ${c.clock_in ? `<div class="m hint">⏱ In ${new Date(c.clock_in).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${c.clock_out ? ' · out ' + new Date(c.clock_out).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) + ' · ' + fmtDur(c.clock_in, c.clock_out) + ' (est. ' + c.duration_hours + 'h)' : ' · on site'}</div>` : ''}
        ${c.tasks_total ? `<div class="m hint">☑ Checklist ${c.tasks_done}/${c.tasks_total}</div>` : ''}
        <div class="actions">
          ${c.cleaner_id ? `<button class="btn sm sec" data-un="${c.id}">Unassign</button>` : `<button class="btn sm" data-as="${c.id}">Assign</button>`}
          <button class="btn sm sec" data-ed="${c.id}">Edit</button>
          <button class="btn sm sec" data-rp="${c.id}">🔁 Repeat</button>
          <button class="btn sm sec" data-ck="${c.id}">☑ Checklist</button>
          ${c.cleaner_id ? `<button class="btn sm sec" data-mc="${c.id}">💬 Crew${c.unread_crew ? `<span class="badge">${c.unread_crew}</span>` : ''}</button>` : ''}

}

// ---------------- media (photos & video) ----------------
const MAX_BYTES = 50 * 1024 * 1024;
const EXT_TYPES = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', heic:'image/heic', heif:'image/heif', mp4:'video/mp4', mov:'video/quicktime', webm:'video/webm' };
const KIND_LABEL = { before:'Before', after:'After', other:'Other' };

async function prepFile(file) {
  let type = file.type || EXT_TYPES[(file.name.split('.').pop() || '').toLowerCase()] || '';
  if (type.startsWith('image/') && !/heic|heif/.test(type)) {
    try { // shrink big phone photos so uploads are fast; keep original if it can't be decoded
      const bmp = await createImageBitmap(file);
      const sc = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
      if (blob && blob.size < file.size) return { blob, type: 'image/jpeg' };
    } catch (e) { /* fall through to original */ }
  }
  return { blob: new Blob([file], { type }), type };
}

async function uploadOne(cleanId, kind, file) {
  const { blob, type } = await prepFile(file);
  if (!type) throw new Error(`${file.name}: unsupported file type`);
  if (blob.size > MAX_BYTES) throw new Error(`${file.name} is over 50 MB. Record a shorter clip (30-60 sec).`);
  const sign = await api(`/api/me/cleans/${cleanId}/media/sign`, { method:'POST', body:{ content_type: type, kind } });
  const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', blob);
  const r = await fetch(sign.signed_url, { method:'PUT', body: fd, headers: { 'x-upsert': 'false' } });
  if (!r.ok) throw new Error(`Upload failed for ${file.name} (${r.status})`);
  await api(`/api/me/cleans/${cleanId}/media`, { method:'POST', body:{ path: sign.path, kind, content_type: type, size: blob.size } });
}

function gridHtml(items, deletable) {
  if (!items.length) return '<div class="empty">No photos or video yet.</div>';
  return `<div class="mgrid">${items.map(i => `<div class="mi">
    ${i.url ? (i.type === 'video' ? `<video src="${esc(i.url)}" controls preload="metadata" playsinline></video>` : `<a href="${esc(i.url)}" target="_blank" rel="noopener"><img src="${esc(i.url)}" loading="lazy" alt=""></a>`) : '<div class="empty">unavailable</div>'}
    <small>${KIND_LABEL[i.kind]}${i.type === 'video' ? ' · video' : ''}</small>
    ${deletable ? `<button class="x" data-del="${i.id}" title="Remove">×</button>` : ''}</div>`).join('')}</div>`;
}

const fmtTime = ts => new Date(ts).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
function threadHtml(msgs, me, who) {

    <small>${x.sender === me ? 'You' : esc(who[x.sender] || x.sender)} · ${fmtTime(x.created_at)}</small></div>`).join('');

// viewer: 'cleaner' or 'admin'. For admin, thread is 'crew' (with the cleaner) or 'client' (with the owner).
async function chatModal(c, viewer, thread = 'crew') {
  const base = viewer === 'cleaner' ? `/api/me/cleans/${c.id}/messages` : `/api/admin/cleans/${c.id}/messages`;
  const getUrl = viewer === 'cleaner' ? base : `${base}?thread=${thread}`;
  const isOwner = viewer === 'admin' && thread === 'client';
  const who = viewer === 'cleaner' ? { admin: 'Nicole' } : thread === 'crew' ? { cleaner: c.cleaner_name || 'Cleaner' } : { client: c.contact_name || 'Owner' };
  let link = '';
  if (isOwner) { const d = await api(`/api/admin/cleans/${c.id}/media`); link = new URL('report.html?t=' + d.report.token, location.href).href; }
  const title = viewer === 'cleaner' ? 'Messages with Nicole' : thread === 'crew' ? `Crew chat · ${esc(c.cleaner_name || '')}` : 'Text the owner';
  const m = modal(`<h2>${title}</h2><div class="m" style="color:var(--mute)">${esc(c.client)} · ${pretty(c.date)}</div>
    <div class="chat" id="chat"></div>
    <textarea id="cb" rows="2" placeholder="Type a message…"></textarea>
    ${isOwner ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--teal);font-weight:600">＋ Request an additional fee</summary>
      <label>Amount ($)</label><input id="cfee" type="number" min="0.01" step="0.01" placeholder="e.g. 45.00"><div class="m" style="color:var(--mute);font-size:13px">Your message above is shown with the fee; the owner can Approve or Decline on their link.</div></details>` : ''}
    <div class="err" id="cerr"></div>
    <div class="actions"><button class="btn" id="cs">Send</button>
      ${isOwner ? `<button class="btn sm sec" id="c_sms">💬 Text link to owner</button><button class="btn sm sec" id="c_mail">✉ Email link</button><button class="btn sm sec" id="c_copy">Copy link</button>` : ''}
      <button class="btn sec" id="cx">Close</button></div>
    ${isOwner ? `<div class="m" style="color:var(--mute);font-size:12px;margin-top:6px">The owner replies on their private link (no login). Send them the link once, then use "Text link" again whenever you want to nudge them.</div>` : ''}`);
  const box = $('#chat', m);
  let last = -1, closed = false;
  const load = async () => {
    try {
      const msgs = await api(getUrl);
      const sig = msgs.length + ':' + msgs.map(x => x.fee_status || '').join('');
      if (sig === last) return; last = sig;
      box.innerHTML = threadHtml(msgs, viewer, who); box.scrollTop = box.scrollHeight;
    } catch (e) { if (!closed) $('#cerr', m).textContent = e.message; }
  };
  const poll = setInterval(() => { if (!document.body.contains(m)) { clearInterval(poll); closed = true; return; } load(); }, 15000);
  const close = () => { clearInterval(poll); closed = true; m.remove(); if (viewer === 'cleaner') cleanerView(); else boardView(); };
  m.onclick = e => { if (e.target === m) close(); };
  $('#cx', m).onclick = close;
  $('#cs', m).onclick = async () => {
    const body = $('#cb', m).value.trim(); if (!body) return;
    const payload = viewer === 'cleaner' ? { body } : { thread, body };
    const fee = isOwner ? $('#cfee', m).value : '';
    if (fee) payload.fee_dollars = fee;
    try { $('#cerr', m).textContent = ''; await api(base, { method:'POST', body: payload }); $('#cb', m).value = ''; if (isOwner) $('#cfee', m).value = ''; last = -1; load(); }
    catch (e) { $('#cerr', m).textContent = e.message; }
  };
  if (isOwner) {
    const text = `Coastal Cleaning PSL - message about your ${c.type} on ${pretty(c.date)}: ${link}`;
    $('#c_sms', m).onclick = () => { location.href = `sms:${(c.contact_phone || '').replace(/[^\d+]/g, '')}?&body=${encodeURIComponent(text)}`; };
    $('#c_mail', m).onclick = () => { location.href = `mailto:${encodeURIComponent(c.contact_email || '')}?subject=${encodeURIComponent('Coastal Cleaning PSL - ' + pretty(c.date))}&body=${encodeURIComponent(text)}`; };
    $('#c_copy', m).onclick = async () => { try { await navigator.clipboard.writeText(link); $('#cerr', m).style.color = 'var(--ok)'; $('#cerr', m).textContent = 'Link copied ✓'; } catch { $('#cerr', m).textContent = 'Copy failed.'; } };
  }
  load();
}

    <div class="err" id="terr"></div>
    <div class="actions">${locked ? '' : '<button class="btn" id="tfin">✔ Finish clean</button>'}<button class="btn sec" id="tx">Close</button></div>
    ${locked ? '' : '<div class="hint" style="margin-top:6px">Tick every task, take your After photos/video, then tap Finish. That clocks you out.</div>'}`);
  const draw = () => { $('#tl', m).innerHTML = tasks.map(t => `<label class="task ${t.done ? 'done' : ''}" style="margin:0;color:inherit;font-size:16px"><input type="checkbox" data-id="${t.id}" ${t.done ? 'checked' : ''} ${locked ? 'disabled' : ''}><span>${esc(t.label)}</span></label>`).join('');
    m.querySelectorAll('input[data-id]').forEach(cb => cb.addEventListener('change', async () => {
      const t = tasks.find(x => x.id == cb.dataset.id); t.done = cb.checked;
      try { await api('/api/me/tasks/' + t.id, { method:'POST', body:{ done: cb.checked } }); draw(); } catch (e) { t.done = !cb.checked; $('#terr', m).textContent = e.message; draw(); } })); };
  draw();
  const close = () => { m.remove(); cleanerView(); };
  m.onclick = e => { if (e.target === m) close(); };
  $('#tx', m).onclick = close;
  if (!locked) $('#tfin', m).onclick = async () => {
    try { await api(`/api/me/cleans/${c.id}/finish`, { method:'POST' }); close(); } catch (e) { $('#terr', m).textContent = e.message; } };
}

async function suppliesModal(c) {
  const m = modal(`<h2>Need supplies?</h2><div class="m hint">${esc(c.client)}</div>
    <label>What do you need?</label><input id="si" placeholder="e.g. toilet paper, trash bags, glass cleaner">
    <div class="err" id="serr"></div><div class="actions"><button class="btn" id="ss">Send to Nicole</button><button class="btn sec" id="sx">Close</button></div>
    <h3 style="margin:14px 0 4px;font-size:15px">My recent requests</h3><div id="sl"></div>`);
  const load = async () => { const l = await api('/api/me/supplies'); $('#sl', m).innerHTML = l.length ? l.map(x => `<div class="cand"><div>${esc(x.item)}<div class="w">${esc(x.client || '')}</div></div><span class="pill ${x.status === 'done' ? 'done' : 'open'}">${x.status}</span></div>`).join('') : '<div class="empty">None yet.</div>'; };
  $('#sx', m).onclick = () => m.remove();
  $('#ss', m).onclick = async () => { const item = $('#si', m).value.trim(); if (!item) return;
    try { await api('/api/me/supplies', { method:'POST', body:{ item, clean_id: c.id } }); $('#si', m).value = ''; $('#serr', m).textContent = ''; load(); } catch (e) { $('#serr', m).textContent = e.message; } };
  load();
}

async function adminTasksModal(c) {
  const m = modal(`<h2>Checklist</h2><div class="m hint">${esc(c.client)} · ${pretty(c.date)}</div><div id="tl"></div>
    <div class="row"><input id="tn" placeholder="Add a task for this clean…"><button class="btn sm" id="ta" style="flex:none;min-width:70px">Add</button></div>
    <div class="err" id="terr"></div><div class="actions"><button class="btn sec" id="tx">Close</button></div>
    <div class="hint" style="margin-top:6px">To change the standard list for a property, edit it under Properties.</div>`);
  const load = async () => { const tasks = await api(`/api/admin/cleans/${c.id}/tasks`);
    $('#tl', m).innerHTML = tasks.map(t => `<div class="task ${t.done ? 'done' : ''}"><span>${t.done ? '✅' : '⬜'} ${esc(t.label)}</span><button data-d="${t.id}" title="Remove">×</button></div>`).join('');
    m.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { await api('/api/admin/tasks/' + b.dataset.d, { method:'DELETE' }); load(); }); };
  $('#ta', m).onclick = async () => { const label = $('#tn', m).value.trim(); if (!label) return;
    try { await api(`/api/admin/cleans/${c.id}/tasks`, { method:'POST', body:{ label } }); $('#tn', m).value = ''; load(); } catch (e) { $('#terr', m).textContent = e.message; } };
  const close = () => { m.remove(); boardView(); };
  m.onclick = e => { if (e.target === m) close(); }; $('#tx', m).onclick = close;
  load();
}

function repeatModal(c) {
  const next = iso(addDays(parse(c.date), 7));
  const m = modal(`<h2>Repeat this clean</h2><div class="m hint">${esc(c.client)} · ${pretty(c.date)} · ${t12(c.start_time)}</div>
    <h3 style="margin:12px 0 4px;font-size:15px">Copy once</h3>
    <div class="row"><input type="date" id="rp_d" value="${next}"><button class="btn sm" id="rp_once" style="flex:none">Copy to this date</button></div>
    <h3 style="margin:14px 0 4px;font-size:15px">Make it recurring</h3>
    ${c.rule_id ? '<div class="hint">This clean is already part of a recurring schedule (manage it under Properties → Recurring).</div>' : `
    <div class="row"><select id="rp_n"><option value="1">Every week</option><option value="2">Every 2 weeks</option><option value="3">Every 3 weeks</option><option value="4">Every 4 weeks</option></select>
    <button class="btn sm" id="rp_rec" style="flex:none">Start schedule</button></div>
    <div class="hint">Same weekday and time as this clean (${pretty(c.date).split(',')[0]}s). New cleans appear on the board automatically, 6 weeks ahead, as "needs a cleaner".</div>`}
    <div class="err" id="rp_err"></div><div class="actions"><button class="btn sec" id="rp_x">Close</button></div>`);
  $('#rp_x', m).onclick = () => m.remove();
  $('#rp_once', m).onclick = async () => { try { const d = $('#rp_d', m).value; await api(`/api/admin/cleans/${c.id}/repeat`, { method:'POST', body:{ date: d } }); m.remove(); weekStart = mondayOf(parse(d)); boardView(); } catch (e) { $('#rp_err', m).textContent = e.message; } };
  if (!c.rule_id) $('#rp_rec', m).onclick = async () => { try { await api('/api/admin/recurring', { method:'POST', body:{ clean_id: c.id, every_weeks: +$('#rp_n', m).value } }); m.remove(); boardView(); } catch (e) { $('#rp_err', m).textContent = e.message; } };
}

async function propsView() {
  const [list, rules] = await Promise.all([api('/api/admin/properties'), api('/api/admin/recurring')]);
  $('#body').innerHTML = `<div class="card"><h2>Saved properties</h2><div class="hint" style="margin-bottom:8px">Save each property once: address, owner contact, door/lockbox info (shown only to the assigned cleaner) and its own checklist.</div>
    <button class="btn" id="pn">＋ Add property</button><div style="margin-top:10px">${list.map(p => `<div class="cand"><div><b>${esc(p.name)}</b> ${p.active ? '' : '<span class="pill done">inactive</span>'}
      <div class="w">${esc(p.address || 'no address')}${p.owner_name ? ' · ' + esc(p.owner_name) : ''}${p.access_info ? ' · 🔑' : ''}${p.checklist ? ' · custom checklist' : ''}</div></div>
      <div class="actions"><button class="btn sm sec" data-pe="${p.id}">Edit</button></div></div>`).join('') || '<div class="empty">No properties yet.</div>'}</div></div>
    <div class="card"><h2>🔁 Recurring cleans</h2>${rules.map(r => `<div class="cand"><div><b>${esc(r.client)}</b> ${r.active ? '' : '<span class="pill done">paused</span>'}
      <div class="w">Every ${r.every_weeks === 1 ? 'week' : r.every_weeks + ' weeks'} · ${parse(r.start_date).toLocaleDateString(undefined, { weekday:'long' })}s at ${t12(r.start_time)} · ${esc(r.type)}</div></div>
      <div class="actions"><button class="btn sm sec" data-rt="${r.id}" data-v="${r.active ? 0 : 1}">${r.active ? 'Pause' : 'Resume'}</button><button class="btn sm danger" data-rd="${r.id}">Delete</button></div></div>`).join('')
      || '<div class="empty">None yet. On the Schedule, tap 🔁 Repeat on a clean and choose "Make it recurring".</div>'}
      <div class="hint" style="margin-top:6px">Pausing or deleting cancels the future cleans from that schedule that nobody is assigned to yet.</div></div>`;
  $('#pn').onclick = () => propertyForm();
  document.querySelectorAll('[data-pe]').forEach(b => b.onclick = () => propertyForm(list.find(p => p.id == b.dataset.pe)));
  document.querySelectorAll('[data-rt]').forEach(b => b.onclick = async () => { await api('/api/admin/recurring/' + b.dataset.rt, { method:'PATCH', body:{ active: b.dataset.v === '1' } }); propsView(); });
  document.querySelectorAll('[data-rd]').forEach(b => b.onclick = async () => { if (confirm('Delete this recurring schedule? Future unassigned cleans from it will be cancelled.')) { await api('/api/admin/recurring/' + b.dataset.rd, { method:'DELETE' }); propsView(); } });
}

function propertyForm(p) {
  const v = p || { name:'', address:'', owner_name:'', owner_phone:'', owner_email:'', access_info:'', checklist:'', default_type:'Airbnb turnover', default_hours:2, active:true };
  const m = modal(`<h2>${p ? 'Edit' : 'Add'} property</h2>
    <label>Property name</label><input id="p_name" value="${esc(v.name)}" placeholder="e.g. Ocean View Condo 4B">
    <label>Address</label><input id="p_addr" value="${esc(v.address)}">
    <div class="row"><div><label>Owner name</label><input id="p_on" value="${esc(v.owner_name || '')}"></div><div><label>Owner phone</label><input id="p_op" type="tel" value="${esc(v.owner_phone || '')}"></div></div>
    <label>Owner email</label><input id="p_oe" type="email" value="${esc(v.owner_email || '')}">
    <div class="row"><div><label>Usual type</label><select id="p_type">${['Airbnb turnover','Residential','Commercial','Carpet','Tile/grout','Upholstery','Deep clean','Other'].map(t => `<option ${t === v.default_type ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div><label>Usual hours</label><input id="p_hrs" type="number" step="0.5" min="0.5" value="${v.default_hours}"></div></div>
    <label>🔑 Access info (door/lockbox code, parking, where supplies are) — only the assigned cleaner sees this</label><textarea id="p_acc" rows="3">${esc(v.access_info)}</textarea>
    <label>☑ Checklist for this property (one task per line; leave blank to use the standard list)</label><textarea id="p_ck" rows="5" placeholder="Kitchen: counters, sink, appliances, floor&#10;Bathrooms: toilet, shower/tub, sink, mirror&#10;Bedrooms: change linens&#10;Restock towels, soap, toilet paper&#10;Take AFTER photos / video">${esc(v.checklist)}</textarea>
    <div class="err" id="p_err"></div>
    <div class="actions"><button class="btn" id="p_save">Save</button>${p ? `<button class="btn sm ${p.active ? 'danger' : 'sec'}" id="p_act">${p.active ? 'Archive' : 'Restore'}</button>` : ''}<button class="btn sec" id="p_x">Close</button></div>
    <div class="hint" style="margin-top:6px">Checklist changes apply to future cleans. A clean that already has its checklist keeps it.</div>`);
  $('#p_x', m).onclick = () => m.remove();
  $('#p_save', m).onclick = async () => {
    const body = { name: $('#p_name', m).value, address: $('#p_addr', m).value, owner_name: $('#p_on', m).value, owner_phone: $('#p_op', m).value, owner_email: $('#p_oe', m).value,
      default_type: $('#p_type', m).value, default_hours: +$('#p_hrs', m).value, access_info: $('#p_acc', m).value, checklist: $('#p_ck', m).value };
    try { await api(p ? '/api/admin/properties/' + p.id : '/api/admin/properties', { method: p ? 'PATCH' : 'POST', body }); m.remove(); propsView(); } catch (e) { $('#p_err', m).textContent = e.message; } };
  if (p) $('#p_act', m).onclick = async () => { await api('/api/admin/properties/' + p.id, { method:'PATCH', body:{ active: !p.active } }); m.remove(); propsView(); };
}

async function suppliesView() {
  const list = await api('/api/admin/supplies');
  $('#body').innerHTML = `<div class="card"><h2>🧴 Supply requests</h2>${list.map(x => `<div class="cand"><div><b>${esc(x.item)}</b> <span class="pill ${x.status === 'done' ? 'done' : x.status === 'ordered' ? 'assigned' : 'open'}">${x.status}</span>
    <div class="w">${esc(x.cleaner_name || '')}${x.client ? ' · ' + esc(x.client) : ''}${x.date ? ' · ' + pretty(x.date) : ''} · ${fmtTime(x.created_at)}</div></div>
    <div class="actions">${x.status === 'open' ? `<button class="btn sm sec" data-s="${x.id}" data-v="ordered">Ordered</button>` : ''}${x.status !== 'done' ? `<button class="btn sm" data-s="${x.id}" data-v="done">Done</button>` : ''}</div></div>`).join('') || '<div class="empty">No supply requests. 🎉</div>'}</div>`;
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => { await api('/api/admin/supplies/' + b.dataset.s, { method:'PATCH', body:{ status: b.dataset.v } }); adminView(); });
}

// ---------------- install as app ----------------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let deferredInstall = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#install').hidden = false; });
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) $('#install').hidden = false;
$('#install').addEventListener('click', async () => {
  if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; $('#install').hidden = true; }
  else modal('<h2>Add to your home screen</h2><p><b>iPhone / iPad (Safari):</b> tap the Share button, then <b>Add to Home Screen</b>.</p><p><b>Android (Chrome):</b> tap the ⋮ menu, then <b>Install app</b> / <b>Add to Home screen</b>.</p><div class="actions"><button class="btn" onclick="this.closest(\'.modal\').remove()">Got it</button></div>');
});
window.addEventListener('appinstalled', () => { $('#install').hidden = true; });

render();
</script>
</body>
</html>
