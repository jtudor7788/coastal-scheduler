<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a Clean | Coastal Cleaning PSL</title>
<style>
  :root { --teal:#0e7c86; --teal-d:#0a5d65; --bg:#f3f7f8; --ink:#17282b; --mute:#66797c; --line:#dbe5e7; --bad:#c0392b; --ok:#2e9d5b; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--teal); color:#fff; padding:18px 16px; text-align:center; }
  header h1 { margin:0; font-size:21px; } header p { margin:4px 0 0; opacity:.9; font-size:14px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  label { display:block; font-size:13px; color:var(--mute); margin:14px 0 4px; }
  input, select, textarea { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#fff; }
  .row { display:flex; gap:10px; } .row > div { flex:1; min-width:0; }
  button { width:100%; margin-top:18px; background:var(--teal); color:#fff; border:0; padding:14px; border-radius:10px; font:inherit; font-weight:700; cursor:pointer; }
  button:hover { background:var(--teal-d); } button:disabled { opacity:.6; }
  .err { color:var(--bad); font-size:14px; margin-top:10px; min-height:18px; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .done { text-align:center; padding:26px 8px; } .done h2 { color:var(--ok); margin:0 0 8px; }
  .fine { color:var(--mute); font-size:13px; margin-top:14px; text-align:center; }
</style>
</head>
<body>
<header><h1>🌊 Coastal Cleaning PSL</h1><p>Request a clean. We'll confirm by phone or email.</p></header>
<main>
  <div class="card" id="formcard">
    <form id="f" novalidate>
      <label for="name">Your name</label><input id="name" autocomplete="name" required>
      <div class="row">
        <div><label for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel"></div>
        <div><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
      </div>
      <label for="addr">Address to be cleaned</label><input id="addr" autocomplete="street-address" required>
      <label for="type">Type of clean</label>
      <select id="type"><option>Airbnb turnover</option><option>Residential</option><option>Deep clean</option><option>Commercial</option><option>Carpet</option><option>Tile/grout</option><option>Upholstery</option><option>Other</option></select>
      <div class="row">
        <div><label for="date">Preferred date</label><input id="date" type="date" required></div>
        <div><label for="time">Preferred start</label><input id="time" type="time" value="10:00"></div>
      </div>
      <label for="notes">Anything we should know? (size, pets, access/door code, guest check-in time…)</label>
      <textarea id="notes" rows="3"></textarea>
      <div class="hp" aria-hidden="true"><label>Website<input id="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="err" id="err"></div>
      <button id="go" type="submit">Send request</button>
      <div class="fine">Phone or email required. This is a request, not a confirmed booking. We'll reach out to confirm time and price.</div>
    </form>
  </div>
</main>
<script src="config.js"></script>
<script>
const API = (window.COASTAL_API_BASE || '').replace(/\/$/, '');
const $ = s => document.querySelector(s);
const d = new Date(); $('#date').min = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  $('#err').textContent = ''; $('#go').disabled = true; $('#go').textContent = 'Sending…';
  try {
    const r = await fetch(API + '/api/public/request', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({
      contact_name: $('#name').value, contact_phone: $('#phone').value, contact_email: $('#email').value, address: $('#addr').value,
      type: $('#type').value, date: $('#date').value, start_time: $('#time').value, notes: $('#notes').value, website: $('#website').value }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Something went wrong. Please call us.');
    $('#formcard').innerHTML = '<div class="done"><h2>Request sent ✓</h2><p>Thanks! We\'ll contact you shortly to confirm your clean.</p></div>';
  } catch (err) { $('#err').textContent = err.message; $('#go').disabled = false; $('#go').textContent = 'Send request'; }
});
</script>
</body>
</html>
